name: Benchmark APK

# Builds the glass benchmark (benchmarks/android-glass) as a signed-with-debug-key release APK, kept as an artifact.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "benchmarks/android-glass/**"
      - "sdat-android/gradle/libs.versions.toml"
      - "sdat-android/gradle/wrapper/**"
      - "sdat-android/app/src/shared/**"
      - ".depot/workflows/benchmark-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-android-${{ github.event_name == 'api' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  review-gate:
    if: github.event_name == 'pull_request'
    name: Review gate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.depot/workflows/review-gate.yml

  build:
    needs: review-gate
    if: ${{ !failure() && !cancelled() }}
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' || github.event_name == 'api' }}
      - name: Unit tests and release APK
        working-directory: benchmarks/android-glass
        # SDAT's own Gradle wrapper, so the benchmark builds with the same Gradle as the app.
        run: ../../sdat-android/gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sdat-glass-benchmark
          path: benchmarks/android-glass/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error
