[package]
name = "sdat-desktop"
version = "1.2.2"
edition = "2024"
description = "SDAT desktop: an unofficial native GTK4 / Adwaita music streaming client for TIDAL (Rust port of Tonearm)"
license = "GPL-3.0-or-later"
repository = "https://github.com/Nichokas/SDAT"
readme = "README.md"
keywords = ["tidal", "music", "gtk", "libadwaita", "gnome"]
categories = ["multimedia::audio", "gui"]
publish = false

[dependencies]
tonearm-core = { path = "../sdat-core/tonearm-core", features = ["live-net"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
chrono = "0.4.45"
env_logger = "0.11.11"
glib = "0.22"
gst = { version = "0.25.4", package = "gstreamer", features = ["v1_18"] }
gst_audio = { version = "0.25.4", package = "gstreamer-audio" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
libsecret = "0.9.0"
log = "0.4.35"
md-5 = "0.11.0"
qrcode = { version = "0.14.1", default-features = false }
regex = "1"
reqwest = { version = "0.13.5", features = ["json", "blocking", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
urlencoding = "2.1.3"
zbus = "5"

[build-dependencies]
glib-build-tools = "0.22.8"

[lints]
workspace = true

