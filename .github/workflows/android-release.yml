name: Android release

# Called by the Release workflow: builds the signed per-ABI APKs for an android-v* tag and attaches
# them to its release. The signing key exists only in this repository's Actions secrets.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Cache NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;${NDK_VERSION}"
      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      # Same key as the Android workflow, so a release reuses main's Rust cache.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build-rust-android.sh') }}
          save-if: false
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Write the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          base64 -d <<<"$KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APKs
        working-directory: sdat-android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          SDAT_KEYSTORE: ${{ runner.temp }}/release.jks
          SDAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SDAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SDAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      # Unsigned builds are named *-release-unsigned.apk: finding both signed APKs proves the signing ran.
      - name: Attach the APKs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#android-v}"
          files=()
          for abi in arm64-v8a x86_64; do
            src="sdat-android/app/build/outputs/apk/release/app-$abi-release.apk"
            dst="$RUNNER_TEMP/sdat-android-$version-$abi.apk"
            cp "$src" "$dst"
            files+=("$dst")
          done
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
