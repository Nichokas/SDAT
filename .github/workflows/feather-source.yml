name: Feather source

# Keeps feather/source.json in sync with GitHub releases.
# The .ipa is attached by the "iOS build" workflow after the tag is pushed, so this
# also runs when that workflow finishes; runs without an .ipa asset are no-ops.
on:
  release:
    types: [published, edited]
  workflow_run:
    workflows: ["iOS build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to add/refresh (e.g. v1.1.0). Empty = latest release."
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: feather-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # desktop-v* releases belong to the desktop app; only iOS vX.Y.Z tags feed Feather.
    if: (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'v')))
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        # Untrusted values go through env vars, never interpolated into the script.
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ] && [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            tag="$RUN_BRANCH"
          fi
          if [ -z "$tag" ]; then
            tag="$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "Refusing unexpected tag: $tag"; exit 1
          fi
          # Only act on real tags of this repo (not branches named like tags).
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "Not a tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Update source.json
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: python3 sdat-mobile/scripts/update-feather-source.py "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Validate JSON
        run: jq -e '.apps[0].versions | length > 0' feather/source.json

      # Opens a PR instead of committing to main. To commit directly instead, replace
      # this step with: git commit -am "..." && git push origin HEAD:main
      - name: Open PR if changed
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git diff --quiet -- feather/source.json; then echo "No changes"; exit 0; fi
          tag="$TAG"
          branch="feather-source-$tag"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "Feather source: add $tag"
          git push -f origin "$branch"
          state="$(gh pr view "$branch" -R "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null || true)"
          [ "$state" = "OPEN" ] || \
            gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Feather source: add $tag" \
              --body "Automated update of feather/source.json for release $tag."
