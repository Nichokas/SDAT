name: Fedora auto-update

"on":
  release:
    types: [published]
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload the vendor archive for the current version and poke COPR"
        type: boolean
        default: false
  pull_request:
    paths:
      - "packaging/fedora/**"
      - ".github/workflows/fedora-auto-update.yml"

permissions:
  contents: read

concurrency:
  group: fedora-auto-update
  cancel-in-progress: false

jobs:
  detect-version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      current: ${{ steps.detect.outputs.current }}
      is_new: ${{ steps.detect.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: bash packaging/fedora/detect-version.sh

  release:
    needs: detect-version
    if: needs.detect-version.outputs.is_new == 'true' || inputs.force
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: dtolnay/rust-toolchain@stable
      - name: Bump spec and build vendor archive
        env:
          VERSION: ${{ needs.detect-version.outputs.is_new == 'true' && needs.detect-version.outputs.version || needs.detect-version.outputs.current }}
        run: |
          set -euo pipefail
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash packaging/fedora/update-spec.sh "$VERSION"
      - name: Upload vendor archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="dist/tonearm-rs-${VERSION}-vendor.tar.xz"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "$asset" --clobber
          else
            gh release create "v${VERSION}" "$asset" --title "Tonearm ${VERSION}" --notes "Tonearm ${VERSION}"
          fi
      - name: Commit spec bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/fedora/tonearm-rs.spec
          if git diff --cached --quiet; then echo "spec unchanged"; exit 0; fi
          git commit -m "packaging(fedora): update to ${VERSION}"
          git push origin HEAD:main
      - name: Trigger COPR rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=copr-rebuild

  spec-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: dnf -y install rpmlint rpm-build rpmdevtools 'dnf-command(builddep)' git-core
      - name: rpmlint
        run: rpmlint packaging/fedora/tonearm-rs.spec || true
      - name: rpmbuild smoke (SRPM + full offline build)
        run: |
          set -euo pipefail
          spec=packaging/fedora/tonearm-rs.spec
          mkdir -p ~/rpmbuild/SOURCES
          spectool -g -C ~/rpmbuild/SOURCES "$spec"
          dnf -y builddep "$spec"
          rpmbuild -ba "$spec"
          rpm -qpl ~/rpmbuild/RPMS/*/tonearm-rs-*.rpm
