name: Android

on:
  push:
    branches: [main]
    paths: &paths
      - "sdat-android/**"
      - "sdat-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-rust-android.sh"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.1.12297006
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Cache NDK
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}
      - name: Install NDK
        if: steps.ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;${NDK_VERSION}"
      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and test
        working-directory: sdat-android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest
      - name: Check both ABIs carry the Rust core and no iroh cdylibs
        run: |
          apk=sdat-android/app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a x86_64; do unzip -l "$apk" | grep -q "lib/$abi/libtonearm_ffi.so"; done
          ! unzip -l "$apk" | grep -q "/libiroh"
      - uses: actions/upload-artifact@v4
        with:
          name: sdat-android-debug
          path: sdat-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
