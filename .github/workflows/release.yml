name: Release

# Bumps each chosen platform from its newest tag (desktop and iOS versions are independent),
# commits the bump to main, creates the GitHub releases with generated notes, then runs the
# platform builds. Releases made with GITHUB_TOKEN do not fire `release` or tag `push` events,
# so the builds are called here directly.
on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "Desktop bump"
        type: choice
        options: [none, patch, minor, major]
        default: none
      ios:
        description: "iOS bump"
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      desktop: ${{ steps.bump.outputs.desktop }}
      ios: ${{ steps.bump.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bump versions
        id: bump
        env:
          DESKTOP: ${{ inputs.desktop }}
          IOS: ${{ inputs.ios }}
        run: |
          set -euo pipefail
          tags=()
          if [[ "$DESKTOP" != none ]]; then
            tag="$(scripts/release-bump.sh desktop "$DESKTOP")"
            tags+=("$tag"); echo "desktop=$tag" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$IOS" != none ]]; then
            tag="$(scripts/release-bump.sh ios "$IOS")"
            tags+=("$tag"); echo "ios=$tag" >> "$GITHUB_OUTPUT"
          fi
          if [[ ${#tags[@]} -eq 0 ]]; then echo "::error::Pick a bump for desktop, iOS or both"; exit 1; fi
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"

      - name: Commit the bump to main
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.bump.outputs.tags }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Release ${TAGS// /, }"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.bump.outputs.tags }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            series="${tag%%[0-9]*}"
            prev="$(git tag -l "${series}*" | grep -E "^${series}[0-9]+\.[0-9]+\.[0-9]+$" | sort -V | tail -1 || true)"
            args=(--target "$SHA" --generate-notes)
            [[ -n "$prev" ]] && args+=(--notes-start-tag "$prev")
            if [[ "$series" == desktop-v ]]; then
              args+=(--title "SDAT desktop ${tag#desktop-v}" --latest=false)
            else
              args+=(--title "$tag")
            fi
            gh release create "$tag" "${args[@]}"
            echo "Released $tag (notes since ${prev:-the beginning})" >> "$GITHUB_STEP_SUMMARY"
          done

  desktop:
    needs: tag
    if: needs.tag.outputs.desktop != ''
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-fedora.yml
    with:
      tag: ${{ needs.tag.outputs.desktop }}

  ios:
    needs: tag
    if: needs.tag.outputs.ios != ''
    permissions:
      contents: write
    uses: ./.github/workflows/ios-build.yml
    with:
      tag: ${{ needs.tag.outputs.ios }}

  feather:
    needs: [tag, ios]
    if: needs.tag.outputs.ios != ''
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/feather-source.yml
    with:
      tag: ${{ needs.tag.outputs.ios }}
