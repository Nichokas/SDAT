name: Rust (core + desktop)

on:
  push:
    branches: [main]
    paths:
      - "sdat-core/**"
      - "sdat-desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "sdat-core/**"
      - "sdat-desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

# A new push to a PR supersedes its running build. Each main build gets its own group, so none is
# cancelled or replaced while queued and every one saves the cache.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Builds wait for the reviewers: their findings usually mean another push, which would cancel the build.
  # Fork PRs get no review and skip the gate, so their code never runs with this token.
  review-gate:
    name: Review gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          sparse-checkout: scripts/review_bot.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Wait for the review bot
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/review_bot.py gate --pr "$PR" --sha "$SHA"

  core:
    needs: review-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          # PRs restore main's cache but do not save their own (keeps the 10 GB quota for main).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test core and FFI
        run: cargo test -p tonearm-core -p tonearm-ffi --locked
  desktop:
    needs: review-gate
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install GTK/GStreamer deps
        run: dnf -y install --setopt=install_weak_deps=False tar zstd cargo rust gcc git-core gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel libsecret-devel openssl-devel glib2-devel
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-fedora
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `cargo test` builds the whole crate, so a separate `cargo check` only compiled it twice.
      - name: Test desktop app (migration and other unit tests)
        run: cargo test -p sdat-desktop --locked
