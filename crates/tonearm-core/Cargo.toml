[package]
name = "tonearm-core"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform-independent TIDAL client core of Tonearm (API, models, queue, scrobbling protocol)"
readme = "../../README.md"
keywords = ["tidal", "music"]
categories = ["multimedia::audio"]
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
log = "0.4.35"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints]
workspace = true
