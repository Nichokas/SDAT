[package]
name = "tonearm-ffi"
version = "1.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "UniFFI bindings of tonearm-core for the SDAT iOS and Android apps"
publish = false

[lib]
name = "tonearm_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
# Host-only tools that generate the Swift and Kotlin bindings.
bindgen = ["uniffi/cli"]

[dependencies]
tonearm-core = { path = "../tonearm-core", features = ["live-net"] }
uniffi = "0.32"
blocking = "1"
thiserror = "2"
log = "0.4.35"

[lints]
workspace = true
